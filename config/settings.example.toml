# study-web 示例配置（入库）
# 复制为 settings.toml 后修改个人参数即可使用
# 密钥不进本文件，放 .env（LLM_API_KEY / LLM_BASE_URL）

total_days = 25
docx_dir = "../docx"
active_workspace = ""
init_max_tokens = 8192
code_line_limit = 20
code_line_exemption_days = [21]
mastery_pass_score = 3.0
force_skip_score = 2.0
round_review_interval = [5, 6]
status_enum = ["not_started", "in_progress", "completed", "postponed"]
review_min_questions = 8
study_review_min_chars = 3000
chat_history_max_turns = 20
ai_read_max_per_reply = 3   # AI 读文件 tool-use：单条回复最多 READ 次数
ai_read_max_lines = 200     # 单次注入给 AI 的最大行数
review_intervals = [1, 3, 7]  # 间隔复习到期窗口（距来源天的天数）
review_max_items = 6          # 单日复习项上限（回滚 > 卡壳 > 疑问）
init_detail_days = 3          # 初始化时细化前 N 天，其余粗纲滚动细化
verify_timeout = 300          # [验证代码] 构建/测试超时秒数
verify_offline = false        # true 时 maven 加 -o 禁网络（需依赖已缓存）
materials_prefetch_max_chars = 6000   # 备课预取注入总量上限（字符）
materials_catalog_max_lines = 60      # 注入 system 的资料清单行数上限
materials_cache_max_chars = 500000    # 单资料解析缓存字符上限
model_half_life_days = 14       # 学习者模型 mastery 证据衰减半衰期（天）
mastery_cap_without_code = 0.6  # 无 code_verify_pass 证据的 concept 封顶（防"看懂"幻觉）
qa_capture_enabled = true       # 复盘评分后自动从拷打记录提炼话术到 InterviewQA.md
qa_capture_max_entries = 2      # 单次拷打反喂沉淀话术条数上限
agent_mode_enabled = true       # M6 起默认开：session.mode 默认 study 零影响，code 模式（planner 引擎）由 UI 显式切换

# M3.3 安全加固
production_mode = false          # true 时关闭 /docs、/redoc
security_headers_enabled = true  # 安全响应头中间件开关
auth_cookie_secure = false       # 生产环境（HTTPS）设为 true
allow_private_urls = false       # true 时允许内网 LLM 地址（如 Ollama）

# token 估算成本用定价（近似值，以官方为准；无定价的模型只显 token）
[pricing."deepseek-chat"]
input_per_million = 2
output_per_million = 8
currency = "CNY"

# DeepSeek V4 官方定价（2026-05-31 永久价 + 峰谷机制，高峰 ×2）
[pricing."deepseek-v4-flash"]
input_per_million = 1
output_per_million = 2
cache_hit_per_million = 0.02
currency = "CNY"

[pricing."deepseek-v4-pro"]
input_per_million = 3
output_per_million = 6
cache_hit_per_million = 0.025
currency = "CNY"

# 峰谷：高峰时段（9:00-12:00、14:00-18:00）全价目 ×2
[pricing.peak]
multiplier = 2
hours = [[9, 12], [14, 18]]

# Agnes 限时免费（2026-07 官网刊例 $0；恢复收费后在此改回标准价 $0.03/$0.15）
[pricing."agnes-2.0-flash"]
input_per_million = 0
output_per_million = 0
currency = "USD"

# evidence 固定 delta 表（LLM 只选类型，数值只允许这里改）
[evidence_delta]
quiz_right = 0.10
quiz_wrong = -0.15
teach_back_pass = 0.25
teach_back_fail = -0.20
code_verify_pass = 0.20
code_verify_fail = -0.10
sync_mastered = 0.10
sync_stuck = -0.10
note_distilled = 0.05
mark_wrong = -0.05
prereq_pass = 0.40        # M7 先修诊断通过：置初始 mastery（爬升档，不超达标线 0.7）
prereq_fail = -0.10       # M7 先修诊断未通过

# 上下文三层控制（M5b）：窗口预算/压缩触发/钉住/归档
[context]
budget_tokens = 256000
trigger_ratio = 0.8
pin_top_k = 5
archive_max_chars = 4000
max_messages = 200
planner_max_actions_per_reply = 4
# 各模型上下文上限（标称值，以厂商为准，可自调）；未知模型用 default（保守）
[model_context]
default = 32768
deepseek-chat = 65536
deepseek-v4-pro = 1048576
deepseek-v4-flash = 1048576
"agnes-2.0-flash" = 524288

[llm]
provider = "openai"
warmup_on_start = true
[llm.openai_compat]
model = "gpt-4o"
max_tokens = 4096
temperature = 0.7
base_url = "https://api.openai.com/v1"
api_key_env = "LLM_API_KEY"
[llm.deepseek_official]
model = "deepseek-v4-flash"
max_tokens = 4096
temperature = 0.7
base_url = "https://api.deepseek.com/v1"
api_key_env = "LLM_API_KEY_DEEPSEEK"
[llm.agnes]
model = "agnes-2.0-flash"
max_tokens = 4096
temperature = 0.7
base_url = "https://apihub.agnes-ai.cn/v1"
api_key_env = "LLM_API_KEY_AGNES"

[[stages]]
name = "teaching"
next = "coding"
sop_step = "步骤一：文档带读"
instruction = "提炼当天文档/知识的核心要点进行带读讲解，单次回复正文控制在 1000 字以内，杜绝超前引入未学过的概念。"

[[stages]]
name = "coding"
next = "source_review"
sop_step = "步骤二：Replica 交互式编码"
instruction = "在 <复现名> 下提供 Demo 骨架和关键逻辑占位（如 // TODO 填空），引导用户手写关键行并跑通调试。禁止直接给出完整可复制实现，单次连续代码不超过配置的行数上限。"

[[stages]]
name = "source_review"
next = "paper"
sop_step = "步骤三：源码深度对照"
instruction = "用户跑通 Demo 后，引导阅读 <项目名> 源码，按 Why（架构权衡）/ Where（类名方法名定位）/ QA（面试三连问）三要素深度讲解。"

[[stages]]
name = "paper"
next = "quiz_r1"
sop_step = "步骤四：前沿论文/文章带读"
instruction = "带读当日推荐论文的核心章节，阐明其在业界方案设计、算法演进和面试加分中的作用。"

[[stages]]
name = "quiz_r1"
next = "quiz_r2"
sop_step = "步骤五-1：第一轮追问"
instruction = "发起第一轮检验提问，考点为基础概念/参数意义（What/How）。只出一道题，出题后停止，等待用户回答。用户提交答案后先专业点评、纠正偏差、给出面试口径，然后立即进入第二轮。"

[[stages]]
name = "quiz_r2"
next = "scored"
sop_step = "步骤五-2：第二轮追问"
instruction = "发起第二轮深度追问，必须触及底层原理（数学逻辑、源码类与方法定位、业务决策 Why/Where）。只出一道题，出题后停止。用户提交答案后点评并给出终期量化评分，评分必须以【评分：X.X】标记输出（1.0-5.0）。"

[[stages]]
name = "scored"
next = "completed"
sop_step = "终期评分与推进征求"
instruction = "根据评分输出跳转预告（及格）或拒绝推进（不及格），等待用户确认。"

[[stages]]
name = "completed"
next = ""
sop_step = "单元完成"
instruction = "单元已完成，输出下一单元开场或当日总结。"

# ---------- 触发指令注册表 ----------
# handler = "declarative" 走通用解释器；其余为 commands/ 下代码 handler 名
[commands."开始今日学习"]
handler = "start_day"
sop_card = "SOP_开始今日学习.md"

[commands."恢复学习"]
handler = "resume"
sop_card = "SOP_恢复学习.md"

[commands."下一内容"]
handler = "next_content"
sop_card = "SOP_下一内容.md"

[commands."强制下一内容"]
handler = "next_content"
sop_card = "SOP_下一内容.md"
mode = "force"

[commands."超前学习"]
handler = "next_content"
sop_card = "SOP_下一内容.md"
mode = "ahead"

[commands."同步"]
handler = "sync"
sop_card = "SOP_同步.md"

[commands."开始写代码"]
handler = "code_mode"
sop_card = "SOP_开始写代码.md"

[commands."验证代码"]
handler = "verify_code"
sop_card = ""

[commands."模拟面试"]
handler = "interview"
sop_card = ""

[commands."先修诊断"]
handler = "prereq"
sop_card = ""

[commands."开始今日复盘"]
handler = "day_review"
sop_card = "SOP_开始今日复盘.md"

[commands."结束今日学习"]
handler = "end_day"
sop_card = "SOP_结束今日学习.md"

[commands."跳转天数"]
handler = "jump_day"
sop_card = "SOP_跳转天数.md"

# ---------- 个人工作区配置请移至 settings.local.toml ----------
# [[code_roots]] 和 [[workspaces]] 段属于个人配置，请在 settings.local.toml 中填写

# M1 教学大脑参数
[bkt_params]
p_init = 0.1
p_transit = 0.1
p_slip = 0.1
p_guess = 0.25

[fsrs_params]
request_retention = 0.9

[metrics]
weights = [0.3, 0.3, 0.4]

# M2 Web 搜索
[web_search]
provider = "duckduckgo"
cache_size = 100
cache_ttl_seconds = 3600

# M2.2 文件上传
[upload]
max_size_mb = 10           # 单文件最大 MB
allowed_image_types = [".jpg", ".jpeg", ".png", ".gif", ".webp"]
allowed_doc_types = [".md", ".txt", ".pdf"]

# M2.3 MCP Client
[[mcp.servers]]
name = "example"
transport = "stdio"
command = "echo"
args = []
enabled = false

# M2.4 Plugin 系统
[plugins]
enabled = []
autoload = true
